name: One-time approved Pages history cleanup
on:
  push:
    paths:
      - '.github/workflows/one-time-pages-history-cleanup.yml'
  workflow_dispatch:
permissions:
  deployments: write
concurrency:
  group: one-time-pages-history-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository_owner == 'hplin50643'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only owner-approved deployment IDs and verify retained history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          repo = 'hplin50643/techstream-key-analysis'
          targets = [{'id': 7477358134, 'sha': 'a2e64bea4f48f3bedef8af5964e97b1d6dbf4452', 'date': '2026-11-01T18:42:40Z'}, {'id': 7477107671, 'sha': '11bf334081bf4e3025f992ac1f49d937d7011af8', 'date': '2026-11-01T18:21:25Z'}, {'id': 7477079757, 'sha': '21feb2927e2011cb915e11c70f11aa3735481d6d', 'date': '2026-11-01T18:19:14Z'}, {'id': 7476962998, 'sha': '15168c2ec1f7e2afc75426d3faa00ab151858181', 'date': '2026-11-01T18:10:06Z'}]
          token = os.environ["GH_TOKEN"]
          base = "https://api.github.com/repos/" + repo
          def api(path, method="GET", data=None):
              req=urllib.request.Request(base+path, data=None if data is None else json.dumps(data).encode(), method=method, headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req) as r:
                  raw=r.read()
                  return json.loads(raw) if raw else None
          def listing():
              out=[]
              for page in range(1,101):
                  rows=api("/deployments?per_page=100&page="+str(page))
                  out.extend(rows)
                  if len(rows)<100:return out
              raise RuntimeError("Unexpected deployment count")
          before=listing()
          ids={d["id"]:d for d in before}
          target_ids={t["id"] for t in targets}
          preserve=set(ids)-target_ids
          assert preserve, "Refuse to delete every deployment"
          expected_url="https://hplin50643.github.io/"+repo.split("/")[1]+"/"
          new_success=False
          for d in before:
              if d["id"] in preserve and d["environment"]=="github-pages":
                  statuses=api("/deployments/"+str(d["id"])+"/statuses?per_page=100")
                  if statuses and statuses[0]["state"]=="success" and statuses[0].get("environment_url","").rstrip("/")==expected_url.rstrip("/"):
                      new_success=True
                      break
          assert new_success, "No retained successful new-account deployment"
          for t in targets:
              d=ids.get(t["id"])
              if d is None:
                  print("Already absent", t["id"])
                  continue
              assert d["sha"]==t["sha"] and d["environment"]=="github-pages", "Target identity mismatch"
          print("Validated fixed target IDs:",sorted(target_ids))
          print("Retaining IDs:",sorted(preserve))
          for t in targets:
              if t["id"] not in ids:continue
              path="/deployments/"+str(t["id"])
              statuses=api(path+"/statuses?per_page=100")
              if not statuses or statuses[0]["state"]!="inactive":
                  api(path+"/statuses","POST",{"state":"inactive","auto_inactive":False,"description":"Owner-approved old-account deployment history cleanup"})
              api(path,"DELETE")
              print("Deleted",t["id"])
          after={d["id"] for d in listing()}
          assert not (target_ids & after), "Approved target remains"
          assert preserve <= after, "Non-target deployment missing"
          print("VERIFIED: all approved targets absent; all pre-existing non-target deployments retained.")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Verified deployment history cleanup\n"+"Repository: "+repo+"\n\n"+"Approved IDs absent: "+", ".join(map(str,sorted(target_ids)))+"\n\n"+"Preserved existing IDs: "+", ".join(map(str,sorted(preserve)))+"\n")
